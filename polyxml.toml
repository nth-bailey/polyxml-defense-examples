[workspace]
name = "anduril-lattice-uci-bridge"
schemas = ["schemas/uci/uci_entity_core.xsd"]
output_base_dir = "generated"
custom_header = "// CLASSIFICATION: UNCLASSIFIED // NATO STANAG / UCI Telemetry // Generated by PolyXML."

[[generate]]
target = "rust"
output = "rust"
zero_copy = true
codecs = true
rkyv = true

[[generate]]
target = "python"
output = "python"
backend = "dataclass"
codecs = true

[[generate]]
target = "go"
output = "go"
package = "uci"

[[generate]]
target = "cpp"
output = "cpp"


[[generate]]
target = "java"
output = "java"
package = "com.enterprise.uci"

[[generate]]
target = "typescript"
output = "typescript"
zod = true

[[generate]]
target = "csharp"
output = "csharp"
namespace = "Enterprise.Uci"
source_gen = true

